---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mautrix-discord
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      mautrix-discord:
        labels:
          postgres: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            vault.security.banzaicloud.io/vault-env-daemon: "true"
        containers:
          app:
            image:
              repository: dock.mau.dev/mautrix/discord
              tag: v0.7.1
            command:
              - /bin/sh
              - -c
              - |
                cp -f /tmp/config/* /data/ 2>/dev/null || true
                sed -e "s|DB_USER_PLACEHOLDER|$DB_USER|g" -e "s|DB_PASS_PLACEHOLDER|$DB_PASS|g" /tmp/config/config.yaml > /data/config.yaml
                exec /usr/bin/mautrix-discord -c /data/config.yaml --no-update
            workingDir: /data
            env:
              TZ: ${TIMEZONE}
              DB_USER: "$${vault:database/creds/mautrix-discord-role#username}"
              DB_PASS: "$${vault:database/creds/mautrix-discord-role#password}"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 8000
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 404"]
        hostnames:
          - "{{ .Release.Name }}.${DOMAIN1}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
    persistence:
      config:
        type: configMap
        name: mautrix-discord-config
        advancedMounts:
          mautrix-discord:
            app:
              - path: /tmp/config
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      tmpfs:
        type: emptyDir
        advancedMounts:
          mautrix-discord:
            app:
              - path: /tmp
                subPath: tmp
