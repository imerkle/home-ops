---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      temporal:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            vault.security.banzaicloud.io/mutate: "skip"
            vault.security.banzaicloud.io/vault-env-daemon: "true"
        initContainers:
          copy-vault-env:
            image:
              repository: ghcr.io/bank-vaults/vault-env
              tag: v1.21.3
            command: ["sh", "-c", "cp /usr/local/bin/vault-env /vault/"]
        containers:
          app:
            image:
              repository: temporalio/auto-setup
              tag: 1.24.2
            command: ["/vault/vault-env", "/etc/temporal/entrypoint.sh", "autosetup"]
            env:
              DB: postgres12
              DB_PORT: "5432"
              POSTGRES_USER: "$${vault:database/creds/temporal-role#username}"
              POSTGRES_PWD: "$${vault:database/creds/temporal-role#password}"
              POSTGRES_SEEDS: "pg-default-rw.db.svc.cluster.local"
              SKIP_DB_CREATE: "true"
              VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
              VAULT_SKIP_VERIFY: "false"
              VAULT_AUTH_METHOD: "jwt"
              VAULT_PATH: "kubernetes"
              VAULT_ROLE: "default"
              VAULT_IGNORE_MISSING_SECRETS: "false"
              VAULT_ENV_DAEMON: "true"
            resources:
              requests:
                cpu: 5m
                memory: 256Mi
              limits:
                memory: 2Gi
          ui:
            image:
              repository: temporalio/ui
              tag: 2.27.0
            env:
              TEMPORAL_ADDRESS: "temporal:7233"
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: temporal
        ports:
          http:
            port: 8080
          grpc:
            port: 7233
    route:
      app:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "temporal.${DOMAIN1}"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Temporal
          gethomepage.dev/description: Workflow Orchestration
          gethomepage.dev/group: Development
        rules:
          - backendRefs:
              - port: 8080
                name: temporal
    persistence:
      vault-env:
        type: emptyDir
        globalMounts:
          - path: /vault/

