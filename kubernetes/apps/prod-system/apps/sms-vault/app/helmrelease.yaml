---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sms-vault
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            vault.security.banzaicloud.io/mutate: "skip"
            vault.security.banzaicloud.io/vault-env-daemon: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "tekton-runner"
              effect: "NoSchedule"
        initContainers:
          copy-vault-env:
            image:
              repository: ghcr.io/bank-vaults/vault-env
              tag: v1.21.3
            command: ["sh", "-c", "cp /usr/local/bin/vault-env /vault/"]
            securityContext:
              runAsUser: 65534
              runAsGroup: 65534
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
        containers:
          app:
            image:
              repository: zot.${DOMAIN1}/sms-vault
              tag: 4c602755f531930721667219a42d47c2754e805c
            command: ["/vault/vault-env", "/app/sms-vault"]
            env:
              PORT: "8081"
              DATABASE_URL: "postgres://$${vault:database/creds/sms-vault-role#username}:$${vault:database/creds/sms-vault-role#password}@pg-default-rw.db.svc.cluster.local:5432/smsvault?sslmode=disable"
              AUTH_SERVER_ADDR: "auth-server.prod-system:50051"
              BASE_URL: "https://sms-vault.${DOMAIN1}"
              VAULT_ADDR: "http://vault.vault.svc.cluster.local:8200"
              VAULT_SKIP_VERIFY: "false"
              VAULT_AUTH_METHOD: "jwt"
              VAULT_PATH: "kubernetes"
              VAULT_ROLE: "default"
              VAULT_IGNORE_MISSING_SECRETS: "false"
              VAULT_ENV_DAEMON: "true"
              VAULT_ENV_SIG: "SIGTERM"
              VAULT_ENV_DELAY: "2"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: 8081
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8081
                  initialDelaySeconds: 2
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 256Mi
      web:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: zot.${DOMAIN1}/sms-vault-web
              tag: 3e7b2539173fc64d538062055b4df988c73f39cf
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8081
          grpc:
            port: 50051
      web:
        controller: web
        ports:
          http:
            port: 80
    serviceMonitor:
      backend:
        enabled: true
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
        serviceName: sms-vault-backend
    route:
      app:
        hostnames:
          - "sms-vault.${DOMAIN1}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /auth
              - path:
                  type: PathPrefix
                  value: /api/auth
            backendRefs:
              - name: auth-server
                namespace: prod-system
                port: 3000
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
              - path:
                  type: PathPrefix
                  value: /metrics
            backendRefs:
              - port: 8081
                name: sms-vault-backend
          - backendRefs:
              - port: 80
                name: sms-vault-web
    persistence:
      vault-env:
        type: emptyDir
        globalMounts:
          - path: /vault/
