---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-design
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      open-design:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/nexu-io/od
              tag: latest
            env:
              NODE_ENV: "production"
              NODE_OPTIONS: "--max-old-space-size=256"
              OD_BIND_HOST: "0.0.0.0"
              OD_PORT: &port "7456"
              OD_WEB_PORT: *port
              OPEN_DESIGN_DISABLE_API_AUTH: "1"
              OPEN_DESIGN_ALLOWED_ORIGINS: "https://open-design.x3y.space"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: open-design
        ports:
          http:
            port: *port
    route:
      app:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "open-design.x3y.space"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: OpenDesign
          gethomepage.dev/description: Collaborative Design Agent Workspace & MCP
          gethomepage.dev/group: Development
        rules:
          - backendRefs:
              - port: *port
                name: open-design
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        storageClass: linstor-ssd
        globalMounts:
          - path: /app/.od
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
