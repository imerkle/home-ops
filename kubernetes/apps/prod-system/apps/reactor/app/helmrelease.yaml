---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app reactor
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      reactor:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "tekton-runner"
              effect: "NoSchedule"
        containers:
          app:
            image:
              repository: zot.${DOMAIN1}/reactor
              tag: 7b92a6500e63938145fed6bfd20b1c564ec30501
            env:
              PORT: "3000"
              TERM: "xterm-256color"
              PYTHONUNBUFFERED: "1"
              HOME: "/tmp"
              REACTOR_CONFIG_PATH: "/tmp/identity.json"
              AUTO_MONITOR: "true"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 10
                  periodSeconds: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: reactor
        ports:
          http:
            port: *port
            appProtocol: kubernetes.io/ws
    route:
      app:
        hostnames:
          - "reactor.${DOMAIN1}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: *port
                name: *app
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
