---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sms-vault
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      backend:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            vault.security.banzaicloud.io/vault-env-daemon: "true"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: zot.${DOMAIN1}/sms-vault
              tag: aba71b62f4911bdc99529a4f293f652fcc10f775
            env:
              PORT: "8081"
              DATABASE_URL: "postgres://$${vault:database/creds/sms-vault-role#username}:$${vault:database/creds/sms-vault-role#password}@pg-default-rw.db.svc.cluster.local:5432/smsvault?sslmode=disable"
              AUTH_SERVER_ADDR: "auth-server.prod-system:50051"
              BASE_URL: "https://sms-vault.${DOMAIN1}"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
      web:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            runAsNonRoot: false
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: zot.${DOMAIN1}/sms-vault-web
              tag: a00f0f0ad6801cac756edc128bded3a2336f17cc
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - CHOWN
                  - SETUID
                  - SETGID
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
    service:
      backend:
        controller: backend
        ports:
          http:
            port: 8081
          grpc:
            port: 50051
      web:
        controller: web
        ports:
          http:
            port: 80
    serviceMonitor:
      backend:
        enabled: true
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
        serviceName: sms-vault-backend
    route:
      app:
        hostnames:
          - "sms-vault.${DOMAIN1}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /auth
              - path:
                  type: PathPrefix
                  value: /api/auth
            backendRefs:
              - name: auth-server
                namespace: prod-system
                port: 3000
          - matches:
              - path:
                  type: PathPrefix
                  value: /api
              - path:
                  type: PathPrefix
                  value: /metrics
            backendRefs:
              - port: 8081
                name: sms-vault-backend
          - backendRefs:
              - port: 80
                name: sms-vault-web
