---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ${APP}-build
spec:
  schedule: "${BUILD_SCHEDULE:=0 3 * * *}"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: kaniko
              image: gcr.io/kaniko-project/executor:latest
              args:
                - "--context=${GIT_REPO}"
                - "--dockerfile=${DOCKERFILE:=Dockerfile}"
                - "--destination=zot.dev-system.svc.cluster.local:5000/${APP}:latest"
                - "--insecure"
                - "--insecure-pull"
          restartPolicy: OnFailure
