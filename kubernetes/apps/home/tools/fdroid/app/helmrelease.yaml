---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fdroid
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/nginxinc/nginx-unprivileged
              tag: alpine
              pullPolicy: IfNotPresent
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    persistence:
      nginx-conf:
        type: configMap
        name: fdroid
        globalMounts:
          - path: /etc/nginx/conf.d/default.conf
            subPath: default.conf
            readOnly: true
    configMaps:
      nginx-config:
        enabled: true
        data:
          default.conf: |
            server {
                listen 8080;
                server_name _;

                location / {
                    proxy_pass http://minio.storage.svc.cluster.local:9000/fdroid/;
                    proxy_set_header Host minio.storage.svc.cluster.local:9000;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;

                    # Fallback to /repo/ if a client requests index-v2.json or files from root
                    proxy_intercept_errors on;
                    error_page 404 = @repo_fallback;

                    # CORS headers for F-Droid and web clients
                    add_header Access-Control-Allow-Origin * always;
                    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
                    add_header Cache-Control "no-cache";

                    proxy_hide_header x-amz-request-id;
                    proxy_hide_header x-minio-deployment-id;
                    proxy_hide_header Server;
                }

                location @repo_fallback {
                    proxy_pass http://minio.storage.svc.cluster.local:9000/fdroid/repo$request_uri;
                    proxy_set_header Host minio.storage.svc.cluster.local:9000;

                    add_header Access-Control-Allow-Origin * always;
                    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                    add_header Access-Control-Allow-Headers "Range, Origin, Content-Type, Accept" always;
                    add_header Cache-Control "no-cache";

                    proxy_hide_header x-amz-request-id;
                    proxy_hide_header x-minio-deployment-id;
                    proxy_hide_header Server;
                }

                location = /healthz {
                    access_log off;
                    return 200 "OK\n";
                }
            }
