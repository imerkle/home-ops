---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app aiostreams-tag-build
  namespace: flux-system
spec:
  targetNamespace: tekton-pipelines
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/components/tag-release-build
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: "aiostreams"
      FORGEJO_REPO: "zitadel-admin/AIOStreams"
      CHECK_SCHEDULE: "15 * * * *"
