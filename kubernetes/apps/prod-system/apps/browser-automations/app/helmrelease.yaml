---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app browser-automations
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    disableWait: true
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      browser-automations:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: zot.${DOMAIN1}/browser-automations
              tag: 10561aa93d103ac6dd27e7f70e8818ea6339f9c8
            env:
              PORT: "8000"
              GRPC_PORT: "50051"
              HOST: "0.0.0.0"
              DB_PATH: "/data/automations.db"
              REPO_DIR: "/app"
              SCRAPER_SCRIPT: "/app/camoufox/run_scrapper.sh"
              HOME: "/tmp"
              XDG_CACHE_HOME: "/app/.cache"
              PLAYWRIGHT_BROWSERS_PATH: "/app/.cache/ms-playwright"
              MOZ_DISABLE_CONTENT_SANDBOX: "1"
              MOZ_DISABLE_GMP_SANDBOX: "1"
              MOZ_DISABLE_RDD_SANDBOX: "1"
              TEMPORAL_HOST: "temporal.dev-system.svc.cluster.local:7233"
              TEMPORAL_NAMESPACE: "default"
              TEMPORAL_TASK_QUEUE: "browser-automations-queue"
              TEMPORAL_ENABLED: "true"
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  initialDelaySeconds: 3
                  periodSeconds: 3
                  timeoutSeconds: 3
                  failureThreshold: 30
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: browser-automations
        ports:
          http:
            port: 8000
          grpc:
            port: 50051
    route:
      app:
        labels:
          enabled-oidc: "true"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Automation
          gethomepage.dev/name: Browser Automations
          gethomepage.dev/description: "Stealth Browser Scraping API & Operations Panel"
          gethomepage.dev/icon: https://raw.githubusercontent.com/chaijunkin/dashboard-icons/main/png/playwright.png
        hostnames:
          - "browser-automations.${DOMAIN1}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: 8000
                name: *app
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        storageClass: linstor-ssd
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
