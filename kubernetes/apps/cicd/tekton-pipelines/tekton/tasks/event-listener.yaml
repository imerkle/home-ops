---
# EventListener: forgejo-webhook
# Listens for Forgejo push & branch-delete webhooks
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: forgejo-webhook
  labels:
    app.kubernetes.io/part-of: tekton-tasks
spec:
  serviceAccountName: tekton-triggers-sa
  triggers:
    - name: forgejo-push-trigger
      interceptors:
        - ref:
            name: "cel"
            kind: ClusterInterceptor
          params:
            - name: "filter"
              # Only trigger on push events to branches (not tags), and skip if all changed files in sms-vault are under flutterui/
              value: >-
                body.ref.startsWith('refs/heads/') &&
                (!has(body.deleted) || !body.deleted) &&
                (!has(body.after) || body.after != '0000000000000000000000000000000000000000') &&
                (
                  body.repository.name != 'sms-vault' ||
                  !has(body.commits) ||
                  body.commits.size() == 0 ||
                  body.commits.exists(c,
                    c.added.exists(f, !f.startsWith('flutterui/')) ||
                    c.modified.exists(f, !f.startsWith('flutterui/')) ||
                    c.removed.exists(f, !f.startsWith('flutterui/'))
                  )
                )
            - name: "overlays"
              value:
                - key: truncated_sha
                  expression: "body.after.truncate(7)"
                # Sanitize branch: strip refs/heads/ prefix, replace '/' with '-'
                - key: sanitized_branch
                  expression: >-
                    body.ref.replace('refs/heads/', '').replace('/', '-')
                # Sanitize repo: convert to lowercase and replace '_' with '-'
                - key: sanitized_repo_name
                  expression: >-
                    body.repository.name.lowerAscii().replace('_', '-')
      bindings:
        - ref: forgejo-push
      template:
        ref: build-and-push

    # ── Flutter Android build trigger ─────────────────────────────────────────
    # Fires on any push to the sms-vault repo where files under flutterui/ have changed.
    - name: forgejo-push-flutter
      interceptors:
        - ref:
            name: "cel"
            kind: ClusterInterceptor
          params:
            - name: "filter"
              value: >-
                body.ref.startsWith('refs/heads/') &&
                body.repository.name == 'sms-vault' &&
                has(body.commits) &&
                body.commits.exists(c,
                  c.added.exists(f, f.startsWith('flutterui/')) ||
                  c.modified.exists(f, f.startsWith('flutterui/')) ||
                  c.removed.exists(f, f.startsWith('flutterui/'))
                )
            - name: "overlays"
              value:
                - key: sanitized_branch
                  expression: >-
                    body.ref.replace('refs/heads/', '').replace('/', '-')
                # Sanitize repo: convert to lowercase and replace '_' with '-'
                - key: sanitized_repo_name
                  expression: >-
                    body.repository.name.lowerAscii().replace('_', '-')
      bindings:
        - ref: forgejo-push
      template:
        ref: flutter-build-android

    - name: forgejo-delete-trigger
      interceptors:
        - ref:
            name: "cel"
            kind: ClusterInterceptor
          params:
            - name: "filter"
              # Trigger on branch delete events from UI or git CLI (push with deleted: true or after: 000...)
              value: >-
                (header.match('X-Gitea-Event', 'delete') && body.ref_type == 'branch') ||
                (header.match('X-Gitea-Event', 'push') && body.ref.startsWith('refs/heads/') && ((has(body.deleted) && body.deleted) || (has(body.after) && body.after == '0000000000000000000000000000000000000000')))
            - name: "overlays"
              value:
                # Sanitize: strip refs/heads/ if present, replace all '/' with '-' to form a valid preview name
                - key: sanitized_branch
                  expression: "body.ref.replace('refs/heads/', '').replace('/', '-')"
                # Sanitize repo: convert to lowercase and replace '_' with '-'
                - key: sanitized_repo_name
                  expression: >-
                    body.repository.name.lowerAscii().replace('_', '-')
      bindings:
        - ref: forgejo-delete
      template:
        ref: cleanup-preview

  resources:
    kubernetesResource:
      spec:
        template:
          spec:
            serviceAccountName: tekton-triggers-sa
            containers:
              - resources:
                  requests:
                    cpu: 50m
                    memory: 64Mi
                  limits:
                    memory: 128Mi
