---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/infra.contrib.fluxcd.io/terraform_v1alpha2.json
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: cloudflare-email-routing
spec:
  interval: 10m
  retryInterval: 10m
  retryStrategy: StaticInterval
  path: ./terraform/cloudflare-email-routing
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  vars:
    - name: mail_domain
      value: "${DOMAIN1}"
  runnerPodTemplate:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
  tfstate:
    forceUnlock: "yes"
    lockIdentifier: d1655760-ddcf-1536-66f9-443f38be3bb5
    lockTimeout: 0s
  approvePlan: auto
