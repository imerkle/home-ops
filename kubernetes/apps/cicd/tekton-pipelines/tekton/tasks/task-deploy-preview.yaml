---
# Tekton Task: deploy-preview
# Clones home-ops, generates preview manifests for a branch, commits & pushes.
# Apps opt in by having a preview/helmrelease.tmpl.yaml alongside their app/ dir.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-preview
  labels:
    app.kubernetes.io/part-of: tekton-tasks
spec:
  description: >-
    Generates branch-preview Kubernetes manifests from a preview template
    and commits them to the home-ops GitOps repo so Flux deploys them.
  params:
    - name: repo-name
      description: Repository/app name (e.g. game-fetcher).
      type: string
    - name: branch
      description: Sanitized branch name (e.g. feature-cool).
      type: string
    - name: commit-sha
      description: The commit SHA to deploy (used as image tag).
      type: string
      default: ""
    - name: target-image-name
      description: Optional target container/image name to update tag for.
      type: string
      default: ""
    - name: home-ops-url
      description: SSH URL of the home-ops repository.
      type: string
      default: git@github.com:imerkle/home-ops.git
    - name: apps-base-path
      description: Path within home-ops where prod-system apps live.
      type: string
      default: kubernetes/apps/prod-system
  workspaces:
    - name: ssh-credentials
      description: >-
        Secret volume containing identity (private key), identity.pub,
        and known_hosts for SSH push access to home-ops.
      mountPath: /root/.ssh-secret
    - name: source
      description: Workspace containing the cloned application repository.
      optional: true
  steps:
    - name: clone-and-deploy
      image: alpine/git:2.43.0
      script: |
        #!/bin/sh
        set -eu

        REPO_NAME="$(params.repo-name)"
        BRANCH="$(params.branch)"
        COMMIT_SHA="$(params.commit-sha)"
        TARGET_IMAGE="$(params.target-image-name)"
        HOME_OPS_URL="$(params.home-ops-url)"
        if [ -z "$${HOME_OPS_URL}" ]; then
          HOME_OPS_URL="git@github.com:imerkle/home-ops.git"
        fi
        APPS_BASE="$(params.apps-base-path)"

        PREVIEW_DIR="$${APPS_BASE}/apps/$${REPO_NAME}/preview"
        TEMPLATE_FILE="$${PREVIEW_DIR}/helmrelease.tmpl.yaml"
        DEPLOY_DIR="$${APPS_BASE}/apps/$${REPO_NAME}-$${BRANCH}"
        KS_FILE="$${APPS_BASE}/kustomization.yaml"

        # ── SSH setup ──────────────────────────────────────────────────────────
        mkdir -p /root/.ssh
        cp /root/.ssh-secret/identity     /root/.ssh/id_ed25519
        cp /root/.ssh-secret/identity.pub /root/.ssh/id_ed25519.pub
        cp /root/.ssh-secret/known_hosts  /root/.ssh/known_hosts
        chmod 600 /root/.ssh/id_ed25519
        chmod 644 /root/.ssh/id_ed25519.pub /root/.ssh/known_hosts

        git config --global user.email "tekton-preview@cluster.local"
        git config --global user.name  "Tekton Preview Bot"

        apk add --no-cache yq

        # ── Clone home-ops ─────────────────────────────────────────────────────
        git clone --depth=1 "$${HOME_OPS_URL}" /workspace/home-ops
        cd /workspace/home-ops

        # ── Branch-specific routing ───────────────────────────────────────────
        if [ "$${BRANCH}" = "main" ] || [ "$${BRANCH}" = "master" ]; then
          echo "Branch is $${BRANCH} — updating production deployment."
          PROD_FILE="$${APPS_BASE}/apps/$${REPO_NAME}/app/helmrelease.yaml"
          TAG="$${COMMIT_SHA}"

          if [ -f "$${TEMPLATE_FILE}" ]; then
            echo "[+] Rendering production HelmRelease from master template: $${TEMPLATE_FILE}"
            mkdir -p "$$(dirname "$${PROD_FILE}")"

            sed -e "s/__APP_NAME__/$${REPO_NAME}/g" \
                -e "s/__BRANCH_PREFIX__//g" \
                -e "s/__COMMIT_SHA__/$${TAG}/g" \
                -e "s/__BRANCH__/main/g" \
                "$${TEMPLATE_FILE}" > "$${PROD_FILE}.tmp"

            awk -v parents="          - name: envoy-internal
            namespace: network
          - name: envoy-external
            namespace: network" '
              /__ROUTE_PARENTS__/ { print parents; next }
              { print }
            ' "$${PROD_FILE}.tmp" > "$${PROD_FILE}"
            rm -f "$${PROD_FILE}.tmp"
          elif [ -f "$${PROD_FILE}" ]; then
            if [ -n "$${TARGET_IMAGE}" ]; then
              echo "Updating tag for image: $${TARGET_IMAGE} -> $${TAG}"
              awk -v target="$${TARGET_IMAGE}" -v newtag="$${TAG}" '
                $0 ~ "repository:.*" target "([^-a-zA-Z0-9]|$)" { in_target=1; print; next }
                in_target && $1 == "tag:" { sub($2, newtag); in_target=0; print; next }
                { print }
              ' "$${PROD_FILE}" > "$${PROD_FILE}.tmp" && mv "$${PROD_FILE}.tmp" "$${PROD_FILE}"
            else
              sed -i "s/\(tag: \).*/\1$${TAG}/g" "$${PROD_FILE}"
            fi
          else
            echo "Production helmrelease not found at $${PROD_FILE} — skipping."
            exit 0
          fi
          git add "$${PROD_FILE}"
        else
          echo "Branch is $${BRANCH} — updating preview deployment."
          # ── Opt-in check ───────────────────────────────────────────────────────
          if [ ! -f "$${TEMPLATE_FILE}" ]; then
            echo "No preview template found at $${TEMPLATE_FILE} — skipping."
            exit 0
          fi

          # ── Check directory status ─────────────────────────────────────────────
          if [ -d "$${DEPLOY_DIR}" ]; then
            echo "Updating existing preview deployment at $${DEPLOY_DIR}"
          else
            echo "Creating new preview deployment at $${DEPLOY_DIR}"
          fi

          # ── Generate preview manifests ─────────────────────────────────────────
          mkdir -p "$${DEPLOY_DIR}/app"

          TAG="$${COMMIT_SHA:-$${BRANCH}}"
          APP_NAME="$${REPO_NAME}-$${BRANCH}"
          BRANCH_PREFIX="$${BRANCH}-"

          # 1. Substitute standard placeholders
          sed -e "s/__APP_NAME__/$${APP_NAME}/g" \
              -e "s/__BRANCH_PREFIX__/$${BRANCH_PREFIX}/g" \
              -e "s/__COMMIT_SHA__/$${TAG}/g" \
              -e "s/__BRANCH__/$${BRANCH}/g" \
              "$${TEMPLATE_FILE}" > "$${DEPLOY_DIR}/app/helmrelease.yaml.tmp"

          # 2. Replace __ROUTE_PARENTS__ with internal gateway
          awk -v parents="          - name: envoy-internal
            namespace: network" '
            /__ROUTE_PARENTS__/ { print parents; next }
            { print }
          ' "$${DEPLOY_DIR}/app/helmrelease.yaml.tmp" > "$${DEPLOY_DIR}/app/helmrelease.yaml"
          rm -f "$${DEPLOY_DIR}/app/helmrelease.yaml.tmp"

          # 3. In-repo environment variable overrides (if provided by feature branch)
          SOURCE_DIR=""
          if [ "$(workspaces.source.bound)" = "true" ]; then
            SOURCE_DIR="$(workspaces.source.path)"
          fi

          if [ -n "$${SOURCE_DIR}" ] && [ -d "$${SOURCE_DIR}" ]; then
            ENV_OVERRIDE=""
            if [ -f "$${SOURCE_DIR}/.preview.env" ]; then
              ENV_OVERRIDE="$${SOURCE_DIR}/.preview.env"
            elif [ -f "$${SOURCE_DIR}/preview.env" ]; then
              ENV_OVERRIDE="$${SOURCE_DIR}/preview.env"
            fi

            if [ -n "$${ENV_OVERRIDE}" ]; then
              echo "[+] Applying in-repo environment overrides from $${ENV_OVERRIDE}..."
              while IFS='=' read -r key value || [ -n "$$key" ]; do
                case "$$key" in \#*|"") continue ;; esac
                key=$$(echo "$$key" | tr -d '[:space:]')
                value=$$(echo "$$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$$//' -e 's/^"//' -e 's/"$$//')
                yq eval ".spec.values.controllers.*.containers.app.env.\"$${key}\" = \"$${value}\"" -i "$${DEPLOY_DIR}/app/helmrelease.yaml"
              done < "$${ENV_OVERRIDE}"
            fi

            if [ -f "$${SOURCE_DIR}/preview.yaml" ]; then
              echo "[+] Merging in-repo preview.yaml overlay..."
              yq eval-all '.spec.values.controllers.*.containers.app.env += load("'"$${SOURCE_DIR}"'/preview.yaml").env' -i "$${DEPLOY_DIR}/app/helmrelease.yaml"
            fi
          fi

          cat > "$${DEPLOY_DIR}/app/kustomization.yaml" << EOF
        ---
        # yaml-language-server: \$schema=https://json.schemastore.org/kustomization
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        resources:
          - ./helmrelease.yaml
        EOF

          cat > "$${DEPLOY_DIR}/ks.yaml" << EOF
        ---
        # yaml-language-server: \$schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: &app $${REPO_NAME}-$${BRANCH}
          namespace: &namespace prod-system
        spec:
          targetNamespace: *namespace
          commonMetadata:
            labels:
              app.kubernetes.io/name: *app
          path: ./$${DEPLOY_DIR}/app
          prune: true
          sourceRef:
            kind: GitRepository
            name: home-kubernetes
            namespace: flux-system
          wait: true
          interval: 30m
          retryInterval: 1m
          timeout: 5m
          postBuild:
            substitute:
              APP: *app
        EOF

          # ── Patch prod-system/kustomization.yaml ───────────────────────────────
          KS_ENTRY="  - ./apps/$${REPO_NAME}-$${BRANCH}/ks.yaml"
          if ! grep -qF "$${KS_ENTRY}" "$${KS_FILE}"; then
            echo "$${KS_ENTRY}" >> "$${KS_FILE}"
          fi
          git add "$${DEPLOY_DIR}" "$${KS_FILE}"
        fi

        # ── Commit and push ────────────────────────────────────────────────────
        if [ -n "$(git status --porcelain)" ]; then
          if [ "$${BRANCH}" = "main" ] || [ "$${BRANCH}" = "master" ]; then
            MSG="flux(prod): update $${REPO_NAME} production to $${TAG}"
          else
            MSG="feat(preview): deploy/update $${REPO_NAME}:$${BRANCH} preview to $${TAG}"
          fi
          git commit -m "$${MSG}"
          git push origin HEAD
          echo "Deployed/updated: $${REPO_NAME}:$${BRANCH} to $${TAG}"
        else
          echo "No changes in deployment manifest detected."
        fi
