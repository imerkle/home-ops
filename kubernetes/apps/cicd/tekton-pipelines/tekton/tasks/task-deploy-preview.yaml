---
# Tekton Task: deploy-preview
# Clones home-ops, dynamically derives preview manifests directly from the app's production HelmRelease, commits & pushes.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-preview
  labels:
    app.kubernetes.io/part-of: tekton-tasks
spec:
  description: >-
    Dynamically generates branch-preview Kubernetes manifests directly from the production
    HelmRelease and commits them to the home-ops GitOps repo so Flux deploys them.
  params:
    - name: repo-name
      description: Repository/app name (e.g. game-fetcher, thumbnail-service).
      type: string
    - name: branch
      description: Sanitized branch name (e.g. feature-cool).
      type: string
    - name: commit-sha
      description: The commit SHA to deploy (used as image tag).
      type: string
      default: ""
    - name: target-image-name
      description: Optional target container/image name to update tag for.
      type: string
      default: ""
    - name: home-ops-url
      description: SSH URL of the home-ops repository.
      type: string
      default: git@github.com:imerkle/home-ops.git
    - name: apps-base-path
      description: Path within home-ops where prod-system apps live.
      type: string
      default: kubernetes/apps/prod-system
  workspaces:
    - name: ssh-credentials
      description: >-
        Secret volume containing identity (private key), identity.pub,
        and known_hosts for SSH push access to home-ops.
      mountPath: /root/.ssh-secret
    - name: source
      description: Workspace containing the cloned application repository.
      optional: true
  steps:
    - name: clone-and-deploy
      image: alpine/git:2.43.0
      script: |
        #!/bin/sh
        set -eu

        REPO_NAME="$(params.repo-name)"
        BRANCH="$(params.branch)"
        COMMIT_SHA="$(params.commit-sha)"
        TARGET_IMAGE="$(params.target-image-name)"
        HOME_OPS_URL="$(params.home-ops-url)"
        if [ -z "$${HOME_OPS_URL}" ]; then
          HOME_OPS_URL="git@github.com:imerkle/home-ops.git"
        fi
        APPS_BASE="$(params.apps-base-path)"

        PROD_FILE="$${APPS_BASE}/apps/$${REPO_NAME}/app/helmrelease.yaml"
        DEPLOY_DIR="$${APPS_BASE}/apps/$${REPO_NAME}/previews/$${BRANCH}"
        KS_FILE="$${APPS_BASE}/kustomization.yaml"

        # ── SSH setup ──────────────────────────────────────────────────────────
        mkdir -p /root/.ssh
        cp /root/.ssh-secret/identity     /root/.ssh/id_ed25519
        cp /root/.ssh-secret/identity.pub /root/.ssh/id_ed25519.pub
        cp /root/.ssh-secret/known_hosts  /root/.ssh/known_hosts
        chmod 600 /root/.ssh/id_ed25519
        chmod 644 /root/.ssh/id_ed25519.pub /root/.ssh/known_hosts

        git config --global user.email "tekton-preview@cluster.local"
        git config --global user.name  "Tekton Preview Bot"

        apk add --no-cache yq

        # ── Clone home-ops ─────────────────────────────────────────────────────
        git clone --depth=1 "$${HOME_OPS_URL}" /workspace/home-ops
        cd /workspace/home-ops

        # ── Check production manifest exists ───────────────────────────────────
        if [ ! -f "$${PROD_FILE}" ]; then
          echo "[-] Base production helmrelease not found at $${PROD_FILE} — skipping."
          exit 0
        fi

        # ── Branch-specific routing ───────────────────────────────────────────
        if [ "$${BRANCH}" = "main" ] || [ "$${BRANCH}" = "master" ]; then
          echo "Branch is $${BRANCH} — updating production deployment."
          TAG="$${COMMIT_SHA}"
          echo "[+] Updating production image tag in $${PROD_FILE} to $${TAG}..."
          yq eval ".spec.values.controllers.*.containers.app.image.tag = \"$${TAG}\"" -i "$${PROD_FILE}"
          git add "$${PROD_FILE}"
        else
          echo "Branch is $${BRANCH} — dynamically deriving preview deployment from $${PROD_FILE}..."

          if [ -d "$${DEPLOY_DIR}" ]; then
            echo "[i] Updating existing preview deployment at $${DEPLOY_DIR}"
          else
            echo "[+] Creating new preview deployment at $${DEPLOY_DIR}"
          fi

          mkdir -p "$${DEPLOY_DIR}/app"
          TAG="$${COMMIT_SHA:-$${BRANCH}}"
          APP_NAME="$${REPO_NAME}-$${BRANCH}"

          # Copy production manifest as base
          cp "$${PROD_FILE}" "$${DEPLOY_DIR}/app/helmrelease.yaml"

          # Extract original route hostnames before mutating
          RAW_HOSTS=$$(yq eval ".spec.values.route.app.hostnames[]" "$${DEPLOY_DIR}/app/helmrelease.yaml" 2>/dev/null || true)

          # Dynamically transform base manifest into preview release
          yq eval "
            .metadata.name = \"$${APP_NAME}\" |
            .spec.values.controllers.\"$${APP_NAME}\" = .spec.values.controllers.\"$${REPO_NAME}\" |
            del(.spec.values.controllers.\"$${REPO_NAME}\") |
            .spec.values.service.app.controller = \"$${APP_NAME}\" |
            .spec.values.controllers.\"$${APP_NAME}\".containers.app.image.tag = \"$${TAG}\" |
            .spec.values.route.app.hostnames[] |= (\"$${BRANCH}-\" + .) |
            .spec.values.route.app.parentRefs = [{\"name\":\"envoy-internal\",\"namespace\":\"network\"}] |
            .spec.values.route.app.rules[-1].backendRefs[0].name = \"$${APP_NAME}\" |
            .spec.values.defaultPodOptions.tolerations += [{\"key\":\"dedicated\",\"operator\":\"Equal\",\"value\":\"tekton-runner\",\"effect\":\"NoSchedule\"}] |
            del(.spec.dependsOn)
          " -i "$${DEPLOY_DIR}/app/helmrelease.yaml"

          # Update serviceMonitor serviceName if present
          if [ "$(yq eval '.spec.values.serviceMonitor.app != null' "$${DEPLOY_DIR}/app/helmrelease.yaml" 2>/dev/null)" = "true" ]; then
            yq eval ".spec.values.serviceMonitor.app.serviceName = \"$${APP_NAME}\"" -i "$${DEPLOY_DIR}/app/helmrelease.yaml"
          fi

          # Convert media persistence to emptyDir for preview pods to avoid node-locked CSI dependencies
          if [ "$(yq eval '.spec.values.persistence.media != null' "$${DEPLOY_DIR}/app/helmrelease.yaml" 2>/dev/null)" = "true" ]; then
            yq eval '
              .spec.values.persistence.media.type = "emptyDir" |
              del(.spec.values.persistence.media.existingClaim) |
              del(.spec.values.persistence.media.globalMounts[].subPath)
            ' -i "$${DEPLOY_DIR}/app/helmrelease.yaml"
          fi

          # Dynamically update public URL env vars matching application hostnames
          for host in $${RAW_HOSTS}; do
            if [ -n "$${host}" ]; then
              sed -i "s|https://$${host}|https://$${BRANCH}-$${host}|g" "$${DEPLOY_DIR}/app/helmrelease.yaml"
            fi
          done

          # In-repo environment variable overrides (.preview.env or preview.yaml)
          SOURCE_DIR=""
          if [ "$(workspaces.source.bound)" = "true" ]; then
            SOURCE_DIR="$(workspaces.source.path)"
          fi

          if [ -n "$${SOURCE_DIR}" ] && [ -d "$${SOURCE_DIR}" ]; then
            ENV_OVERRIDE=""
            if [ -f "$${SOURCE_DIR}/.preview.env" ]; then
              ENV_OVERRIDE="$${SOURCE_DIR}/.preview.env"
            elif [ -f "$${SOURCE_DIR}/preview.env" ]; then
              ENV_OVERRIDE="$${SOURCE_DIR}/preview.env"
            fi

            if [ -n "$${ENV_OVERRIDE}" ]; then
              echo "[+] Applying in-repo environment overrides from $${ENV_OVERRIDE}..."
              while IFS='=' read -r key value || [ -n "$$key" ]; do
                case "$$key" in \#*|"") continue ;; esac
                key=$$(echo "$$key" | tr -d '[:space:]')
                value=$$(echo "$$value" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$$//' -e 's/^"//' -e 's/"$$//')
                yq eval ".spec.values.controllers.\"$${APP_NAME}\".containers.app.env.\"$${key}\" = \"$${value}\"" -i "$${DEPLOY_DIR}/app/helmrelease.yaml"
              done < "$${ENV_OVERRIDE}"
            fi

            if [ -f "$${SOURCE_DIR}/preview.yaml" ]; then
              echo "[+] Merging in-repo preview.yaml overlay..."
              yq eval-all ".spec.values.controllers.\"$${APP_NAME}\".containers.app.env += load(\"$${SOURCE_DIR}/preview.yaml\").env" -i "$${DEPLOY_DIR}/app/helmrelease.yaml"
            fi
          fi

          # Generate kustomization.yaml
          printf -- '---\n# yaml-language-server: $schema=https://json.schemastore.org/kustomization\napiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources:\n  - ./helmrelease.yaml\n' > "$${DEPLOY_DIR}/app/kustomization.yaml"

          # Generate ks.yaml
          printf -- '---\n# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json\napiVersion: kustomize.toolkit.fluxcd.io/v1\nkind: Kustomization\nmetadata:\n  name: &app %s-%s\n  namespace: &namespace prod-system\nspec:\n  targetNamespace: *namespace\n  commonMetadata:\n    labels:\n      app.kubernetes.io/name: *app\n  path: ./%s/app\n  prune: true\n  sourceRef:\n    kind: GitRepository\n    name: home-kubernetes\n    namespace: flux-system\n  wait: true\n  interval: 30m\n  retryInterval: 1m\n  timeout: 5m\n  postBuild:\n    substitute:\n      APP: *app\n' "$${REPO_NAME}" "$${BRANCH}" "$${DEPLOY_DIR}" > "$${DEPLOY_DIR}/ks.yaml"

          # Patch prod-system/kustomization.yaml
          KS_ENTRY="  - ./apps/$${REPO_NAME}/previews/$${BRANCH}/ks.yaml"
          if ! grep -qF "$${KS_ENTRY}" "$${KS_FILE}"; then
            echo "$${KS_ENTRY}" >> "$${KS_FILE}"
          fi
          git add "$${DEPLOY_DIR}" "$${KS_FILE}"
        fi

        # ── Commit and push ────────────────────────────────────────────────────
        if [ -n "$(git status --porcelain)" ]; then
          if [ "$${BRANCH}" = "main" ] || [ "$${BRANCH}" = "master" ]; then
            MSG="flux(prod): update $${REPO_NAME} production to $${TAG}"
          else
            MSG="feat(preview): deploy/update $${REPO_NAME}:$${BRANCH} preview to $${TAG}"
          fi
          git commit -m "$${MSG}"
          git push origin HEAD
          echo "Deployed/updated: $${REPO_NAME}:$${BRANCH} to $${TAG}"
        else
          echo "No changes in deployment manifest detected."
        fi
