---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fdroid-publish
  labels:
    app.kubernetes.io/part-of: tekton-tasks
spec:
  description: >-
    Publishes an Android APK to the self-hosted F-Droid repository on MinIO,
    generates metadata, signs index-v1.jar and index-v2.json, and syncs to S3.
  params:
    - name: apk-path
      description: Absolute path to the built APK file.
      type: string
    - name: app-id
      description: Android application package ID (e.g. com.smsvault.smsvault_flutter).
      type: string
      default: "com.smsvault.smsvault_flutter"
    - name: app-name
      description: Display name of the application.
      type: string
      default: "SMS Vault"
    - name: app-summary
      description: Short summary of the application.
      type: string
      default: "Encrypted SMS backup and synchronization client"
  workspaces:
    - name: source
      description: Workspace containing the source and built APK.
    - name: cache
      description: Cache workspace for tools and repository metadata.
  steps:
    - name: publish
      image: zot.x3y.space/fdroid-publisher:latest
      env:
        - name: DEBIAN_FRONTEND
          value: "noninteractive"
        - name: GIT_PYTHON_REFRESH
          value: "quiet"
        - name: KEYSTORE_BASE64
          valueFrom:
            secretKeyRef:
              name: fdroid-signing-secret
              key: KEYSTORE_BASE64
        - name: KEYSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fdroid-signing-secret
              key: KEYSTORE_PASSWORD
        - name: KEYSTORE_ALIAS
          valueFrom:
            secretKeyRef:
              name: fdroid-signing-secret
              key: KEYSTORE_ALIAS
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: fdroid-signing-secret
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: fdroid-signing-secret
              key: AWS_SECRET_ACCESS_KEY
        - name: MINIO_ENDPOINT
          value: "minio.storage.svc.cluster.local:9000"
        - name: REPO_URL
          valueFrom:
            secretKeyRef:
              name: fdroid-signing-secret
              key: REPO_URL
      script: |
        #!/bin/sh
        set -e

        WORKDIR="/tmp/fdroid-workspace"
        rm -rf "$WORKDIR"
        mkdir -p "$WORKDIR/repo/icons" "$WORKDIR/metadata"
        cd "$WORKDIR"

        # Python S3 helper script
        cat << 'EOPY' > /tmp/s3_helper.py
        import os, sys, base64
        from minio import Minio

        endpoint = os.environ.get("MINIO_ENDPOINT", "minio.storage.svc.cluster.local:9000").replace("http://", "").replace("https://", "")
        ak = os.environ["AWS_ACCESS_KEY_ID"]
        sk = os.environ["AWS_SECRET_ACCESS_KEY"]

        client = Minio(endpoint, access_key=ak, secret_key=sk, secure=False)

        def sync_down(bucket, prefix, local_dir):
            os.makedirs(local_dir, exist_ok=True)
            try:
                objects = client.list_objects(bucket, prefix=prefix, recursive=True)
                for obj in objects:
                    rel_path = os.path.relpath(obj.object_name, prefix)
                    target = os.path.join(local_dir, rel_path)
                    os.makedirs(os.path.dirname(target), exist_ok=True)
                    client.fget_object(bucket, obj.object_name, target)
                    print(f"Downloaded: {obj.object_name}")
            except Exception as e:
                print(f"Sync down note: {e}")

        def sync_up(local_dir, bucket, prefix):
            for root, _, files in os.walk(local_dir):
                for f in files:
                    full_path = os.path.join(root, f)
                    rel_path = os.path.relpath(full_path, local_dir)
                    obj_name = f"{prefix}/{rel_path}".lstrip("/")
                    client.fput_object(bucket, obj_name, full_path)
                    print(f"Uploaded: {obj_name}")

        if sys.argv[1] == "pull":
            sync_down("fdroid", "repo", "/tmp/fdroid-workspace/repo")
        elif sys.argv[1] == "push":
            sync_up("/tmp/fdroid-workspace/repo", "fdroid", "repo")
            if os.path.exists("/tmp/fdroid-workspace/index.html"):
                client.fput_object("fdroid", "index.html", "/tmp/fdroid-workspace/index.html", content_type="text/html")
                print("Uploaded: index.html")
        EOPY

        echo "[fdroid] Pulling existing repository from MinIO (if present)..."
        python3 /tmp/s3_helper.py pull

        echo "[fdroid] Setting up signing keystore..."
        echo "$KEYSTORE_BASE64" | base64 -d > /tmp/fdroid.p12

        cat << EOCONF > "$WORKDIR/config.yml"
        repo_url: "$REPO_URL"
        repo_name: "Personal F-Droid Repo"
        repo_description: "Self-hosted Android applications built with Tekton"
        repo_icon: "icon.png"
        keystore: "/tmp/fdroid.p12"
        keystorepass: "$KEYSTORE_PASSWORD"
        keypass: "$KEYSTORE_PASSWORD"
        repo_keyalias: "$KEYSTORE_ALIAS"
        archive_older: 0
        EOCONF

        # Ensure default repo icon exists
        if [ ! -f "$WORKDIR/repo/icons/icon.png" ]; then
          python3 -c "
        import base64
        with open('$WORKDIR/repo/icons/icon.png', 'wb') as f:
            f.write(base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='))
        "
        fi

        APK_FILE="$(params.apk-path)"
        if [ ! -f "$APK_FILE" ]; then
          echo "[fdroid] ERROR: APK file not found at $APK_FILE"
          exit 1
        fi

        echo "[fdroid] Copying APK to repository: $APK_FILE"
        cp -f "$APK_FILE" "$WORKDIR/repo/"

        # Ensure complete metadata file for the app exists
        cat << EOMETA > "$WORKDIR/metadata/$(params.app-id).yml"
        Categories:
          - System
          - Utilities
        License: Apache-2.0
        AuthorName: Personal
        SourceCode: https://forgejo.x3y.space
        IssueTracker: https://forgejo.x3y.space
        Summary: $(params.app-summary)
        Description: |-
          $(params.app-name) built with Tekton CI/CD.
        AutoUpdateMode: None
        EOMETA

        echo "[fdroid] Running fdroid update to generate index-v1 and index-v2..."
        fdroid update --create-metadata

        echo "[fdroid] Generating web landing page..."
        cat << EOHTML > "$WORKDIR/index.html"
        <!DOCTYPE html>
        <html>
        <head>
          <title>Personal F-Droid Repository</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
            body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; color: #333; }
            .card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px; margin-top: 20px; }
            code { background: #e9ecef; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; word-break: break-all; }
            a.btn { display: inline-block; background: #007bff; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 15px; }
          </style>
        </head>
        <body>
          <h1>Personal F-Droid Repository</h1>
          <p>This repository hosts personal Android applications automatically built and updated by Tekton CI/CD.</p>
          <div class="card">
            <h3>Add to F-Droid / Neo Store / Droid-ify</h3>
            <p>Repository URL:</p>
            <p><code>https://fdroid.x3y.space/repo</code></p>
            <p>Fingerprint:</p>
            <p><code>2882AD4BF00A9205205F64EC139C38B2196CABDF27EBAD6A81EFD4194C6C5110</code></p>
            <a class="btn" href="https://fdroid.x3y.space/repo?fingerprint=2882AD4BF00A9205205F64EC139C38B2196CABDF27EBAD6A81EFD4194C6C5110">Add Repository</a>
          </div>
        </body>
        </html>
        EOHTML

        echo "[fdroid] Syncing repository to MinIO..."
        python3 /tmp/s3_helper.py push

        echo "[fdroid] F-Droid repository successfully updated and published!"
