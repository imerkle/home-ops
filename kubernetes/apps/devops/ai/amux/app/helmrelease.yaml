---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amux
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      amux:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/mixpeek/amux
              tag: latest
            env:
              AMUX_AUTH_TOKEN: "none"
              AMUX_RS_PORT: &port 8822
              IS_SANDBOX: "1"
              AMUX_OPS_HEALTH_CARDS: "0"
            lifecycle:
              postStart:
                exec:
                  command:
                    - /bin/sh
                    - -c
                    - |
                      if ! command -v lsof >/dev/null 2>&1; then
                        if ls /root/.amux/pkg/lsof_*.deb >/dev/null 2>&1; then
                          dpkg -i /root/.amux/pkg/lsof_*.deb || true
                        fi
                        if ! command -v lsof >/dev/null 2>&1; then
                          apt-get update && apt-get install -y --no-install-recommends lsof && \
                          mkdir -p /root/.amux/pkg && cp -n /var/cache/apt/archives/lsof_*.deb /root/.amux/pkg/ 2>/dev/null || true && \
                          rm -rf /var/lib/apt/lists/*
                        fi
                      fi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                    scheme: HTTPS
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: amux
        ports:
          https:
            port: *port
            targetPort: *port
    route:
      app:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "amux.${DOMAIN1}"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: amux
          gethomepage.dev/description: Agent Control Plane
          gethomepage.dev/group: Development
        rules:
          - backendRefs:
              - group: gateway.envoyproxy.io
                kind: Backend
                name: amux
                port: *port
    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: ${STORE1}
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          amux:
            app:
              - path: /root/.amux
