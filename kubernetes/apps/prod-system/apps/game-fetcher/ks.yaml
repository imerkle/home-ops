---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app game-fetcher
  namespace: &namespace prod-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: auth-server
    - name: settings-server
    - name: thumbnail-service
    - name: temporal
      namespace: dev-system
    - name: pg-clusters-default
      namespace: db
    - name: dragonfly-cluster
      namespace: db
    - name: vault
      namespace: vault
  path: ./kubernetes/apps/prod-system/apps/game-fetcher/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false

  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
