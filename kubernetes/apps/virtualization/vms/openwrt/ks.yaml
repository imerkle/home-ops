apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app openwrt
  namespace: &namespace kubevirt
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kubevirt
  wait: false
  path: ./kubernetes/apps/virtualization/vms/openwrt/app
  postBuild:
    substitute:
      OPENWRT_ROUTER_NODE: talos-0d4c1
      OPENWRT_LAN_LINK: br-openwrt-lan
      OPENWRT_WAN_LINK: br-openwrt-wan
      # Temporary address while the old router still owns 10.0.0.1.
      OPENWRT_LAN_IP: 10.0.0.254
      OPENWRT_LAN_NETMASK: 255.255.255.0
