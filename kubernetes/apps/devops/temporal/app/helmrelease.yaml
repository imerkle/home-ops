---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: temporal
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    disableWait: true
  upgrade:
    disableWait: true
  values:
    controllers:
      temporal:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            vault.security.banzaicloud.io/vault-env-daemon: "true"
        containers:
          app:
            image:
              repository: temporalio/auto-setup
              tag: 1.24.2
            env:
              BIND_ON_IP: "0.0.0.0"
              TEMPORAL_ADDRESS: "127.0.0.1:7233"
              DB: postgres12
              DB_PORT: "5432"
              POSTGRES_USER: "$${vault:database/creds/temporal-role#username}"
              POSTGRES_PWD: "$${vault:database/creds/temporal-role#password}"
              POSTGRES_SEEDS: "pg-default-rw.db.svc.cluster.local"
              SQL_MAX_CONN_TIME: "3m"
              SQL_MAX_IDLE_CONNS: "5"
              SKIP_DB_CREATE: "true"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - temporal
                      - operator
                      - cluster
                      - health
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - temporal
                      - operator
                      - cluster
                      - health
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - temporal
                      - operator
                      - cluster
                      - health
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 5m
                memory: 256Mi
              limits:
                memory: 2Gi
          ui:
            image:
              repository: temporalio/ui
              tag: 2.27.0
            env:
              TEMPORAL_ADDRESS: "temporal:7233"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
            resources:
              requests:
                cpu: 5m
                memory: 64Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: temporal
        ports:
          http:
            port: 8080
          grpc:
            port: 7233
    route:
      app:
        enabled: true
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - "temporal.${DOMAIN1}"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Temporal
          gethomepage.dev/description: Workflow Orchestration
          gethomepage.dev/group: Development
        rules:
          - backendRefs:
              - port: 8080
                name: temporal


