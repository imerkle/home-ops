---
# Tekton Task: promote-to-prod
# Promotes a verified candidate build to production in home-ops GitOps,
# triggers immediate Flux reconciliation, and awaits production rollout.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: promote-to-prod
  labels:
    app.kubernetes.io/part-of: tekton-tasks
spec:
  description: >-
    Updates production HelmRelease in home-ops GitOps with verified candidate image tag,
    triggers immediate Flux reconciliation, and waits for deployment rollout.
  params:
    - name: repo-name
      description: Name of the application repository (e.g. thumbnail-service).
      type: string
    - name: commit-sha
      description: Git commit SHA of the verified build to promote.
      type: string
    - name: target-image-name
      description: Optional target container/image name to update tag for.
      type: string
      default: ""
    - name: home-ops-url
      description: SSH URL of the home-ops repository.
      type: string
      default: git@github.com:imerkle/home-ops.git
    - name: apps-base-path
      description: Path within home-ops where prod-system apps live.
      type: string
      default: kubernetes/apps/prod-system
  workspaces:
    - name: ssh-credentials
      description: Secret volume containing identity and known_hosts for SSH push.
      mountPath: /root/.ssh-secret
  steps:
    - name: git-promote-prod
      image: alpine/git:2.43.0
      script: |
        #!/bin/sh
        set -eu

        REPO_NAME="$(params.repo-name)"
        COMMIT_SHA="$(params.commit-sha)"
        TARGET_IMAGE="$(params.target-image-name)"
        HOME_OPS_URL="$(params.home-ops-url)"
        if [ -z "$${HOME_OPS_URL}" ]; then
          HOME_OPS_URL="git@github.com:imerkle/home-ops.git"
        fi
        APPS_BASE="$(params.apps-base-path)"
        PROD_FILE="$${APPS_BASE}/apps/$${REPO_NAME}/app/helmrelease.yaml"
        TEMPLATE_FILE="$${APPS_BASE}/apps/$${REPO_NAME}/preview/helmrelease.tmpl.yaml"

        # ── SSH setup ──────────────────────────────────────────────────────────
        mkdir -p /root/.ssh
        cp /root/.ssh-secret/identity     /root/.ssh/id_ed25519
        cp /root/.ssh-secret/identity.pub /root/.ssh/id_ed25519.pub
        cp /root/.ssh-secret/known_hosts  /root/.ssh/known_hosts
        chmod 600 /root/.ssh/id_ed25519
        chmod 644 /root/.ssh/id_ed25519.pub /root/.ssh/known_hosts

        git config --global user.email "tekton-preview@cluster.local"
        git config --global user.name  "Tekton Preview Bot"

        # ── Clone home-ops ─────────────────────────────────────────────────────
        git clone --depth=1 "$${HOME_OPS_URL}" /workspace/home-ops
        cd /workspace/home-ops

        TAG="$${COMMIT_SHA}"

        if [ -f "$${TEMPLATE_FILE}" ]; then
          echo "[+] Rendering production HelmRelease from master template: $${TEMPLATE_FILE}"
          mkdir -p "$$(dirname "$${PROD_FILE}")"

          sed -e "s/__APP_NAME__/$${REPO_NAME}/g" \
              -e "s/__BRANCH_PREFIX__//g" \
              -e "s/__COMMIT_SHA__/$${TAG}/g" \
              -e "s/__BRANCH__/main/g" \
              "$${TEMPLATE_FILE}" > "$${PROD_FILE}.tmp"

          printf '%s\n' '          - name: envoy-internal' '            namespace: network' '          - name: envoy-external' '            namespace: network' > /tmp/parents-prod.yaml
          sed -e '/__ROUTE_PARENTS__/r /tmp/parents-prod.yaml' -e '/__ROUTE_PARENTS__/d' "$${PROD_FILE}.tmp" > "$${PROD_FILE}"
          rm -f "$${PROD_FILE}.tmp" /tmp/parents-prod.yaml
        elif [ -f "$${PROD_FILE}" ]; then
          echo "[+] Updating tag in existing production helmrelease..."
          if [ -n "$${TARGET_IMAGE}" ]; then
            echo "[+] Updating tag for image: $${TARGET_IMAGE} -> $${TAG}"
            awk -v target="$${TARGET_IMAGE}" -v newtag="$${TAG}" '
              $0 ~ "repository:.*" target "([^-a-zA-Z0-9]|$)" { in_target=1; print; next }
              in_target && $1 == "tag:" { sub($2, newtag); in_target=0; print; next }
              { print }
            ' "$${PROD_FILE}" > "$${PROD_FILE}.tmp" && mv "$${PROD_FILE}.tmp" "$${PROD_FILE}"
          else
            sed -i "s/\(tag: \).*/\1$${TAG}/g" "$${PROD_FILE}"
          fi
        else
          echo "[-] Neither template nor production helmrelease found at $${PROD_FILE} — skipping promotion."
          exit 0
        fi

        git add "$${PROD_FILE}"
        if [ -n "$$(git status --porcelain)" ]; then
          git commit -m "flux(prod): promote $${REPO_NAME} to $${TAG} (passed SLA performance gate)"
          git push origin HEAD
          echo "[+] Promoted $${REPO_NAME} to $${TAG} in home-ops GitOps repo."
        else
          echo "[i] No changes detected in $${PROD_FILE} (already at $${TAG})."
        fi

    - name: sync-flux-and-await-rollout
      image: bitnami/kubectl:latest
      computeResources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      script: |
        #!/bin/bash
        set -euo pipefail

        SERVICE="$(params.repo-name)"
        COMMIT="$(params.commit-sha)"
        NAMESPACE="prod-system"

        echo "=========================================================="
        echo "  Triggering Production Deployment: $$SERVICE"
        echo "  Verified Commit: $$COMMIT"
        echo "=========================================================="

        echo "[+] Triggering immediate Flux reconciliation..."
        kubectl annotate --overwrite gitrepository flux-system -n flux-system reconcile.fluxcd.io/requestedAt="$$(date +%s)" || true
        kubectl annotate --overwrite kustomization "$$SERVICE" -n "$$NAMESPACE" reconcile.fluxcd.io/requestedAt="$$(date +%s)" 2>/dev/null || true
        kubectl annotate --overwrite helmrelease "$$SERVICE" -n "$$NAMESPACE" reconcile.fluxcd.io/requestedAt="$$(date +%s)" 2>/dev/null || true

        echo "[+] Waiting for Flux to apply verified commit $$COMMIT..."
        SYNCED=false
        for i in $$(seq 1 45); do
          CURRENT_IMAGE=$$(kubectl get deployment "$$SERVICE" -n "$$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[?(@.name=="app")].image}' 2>/dev/null || true)
          if [ -z "$$CURRENT_IMAGE" ]; then
            CURRENT_IMAGE=$$(kubectl get deployment "$$SERVICE" -n "$$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)
          fi
          if echo "$$CURRENT_IMAGE" | grep -q "$$COMMIT"; then
            echo "[+] Flux applied verified image: $$CURRENT_IMAGE (after $${i} iterations)"
            SYNCED=true
            break
          fi
          if [ $$((i % 10)) -eq 0 ]; then
            echo "[i] Re-triggering Flux reconciliation (attempt $$i)..."
            kubectl annotate --overwrite gitrepository flux-system -n flux-system reconcile.fluxcd.io/requestedAt="$$(date +%s)" || true
            kubectl annotate --overwrite helmrelease "$$SERVICE" -n "$$NAMESPACE" reconcile.fluxcd.io/requestedAt="$$(date +%s)" 2>/dev/null || true
          fi
          sleep 2
        done

        if [ "$$SYNCED" = false ]; then
          echo "[-] Warning: Flux did not update deployment image to $$COMMIT within timeout."
          echo "[-] Current deployed image: $$CURRENT_IMAGE"
        fi

        echo "[+] Awaiting production rollout..."
        kubectl rollout status deployment/"$$SERVICE" -n "$$NAMESPACE" --timeout=180s

        echo "[+] Production deployment of $$SERVICE ($$COMMIT) successfully rolled out!"
