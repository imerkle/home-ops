---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aiostreams
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      aiostreams:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: zot.x3y.space/aiostreams
              tag: v2.34.0
              pullPolicy: IfNotPresent
            env:
              PORT: &port "3000"
              NODE_ENV: "production"
              BASE_URL: "https://aiostreams.${DOMAIN1}"
              DATABASE_URI: "sqlite:///app/data/db.sqlite"
              DISK_CACHE_DIR: "/tmp/cache"
              LOG_LEVEL: "info"
              LOG_FORMAT: "json"
            envFrom:
              - secretRef:
                  name: aiostreams-secret
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/status
                    port: 3000
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: aiostreams
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "aiostreams.${DOMAIN1}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: AIOStreams
          gethomepage.dev/icon: mdi-movie-play
          gethomepage.dev/description: "All-in-One Stremio Addon"
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
